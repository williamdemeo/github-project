name: ci

# The template's own CI: structural lint of the example plan, the test
# suite (offline; a recorded fake gh), shell lint, and a minimal Python
# lint.  Deliberately not Nix-based — consumers must be able to use this
# template with nothing but python3, gh, and make (the flake is a
# convenience, never a requirement).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the documented floor; 3.12 the current default.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Structural lint of the example plan
        run: make lint

      - name: Test suite
        run: make test

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shellcheck
        run: shellcheck scripts/ci/*.sh

      - name: Python lint (errors and pyflakes only)
        run: |
          pip install ruff
          ruff check --select E9,F scripts/
